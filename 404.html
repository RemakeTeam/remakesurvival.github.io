<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Страница не найдена</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient( 135deg, #0A0B0D 0%, #101014 55%, #17101D 100% );
            color: #F7F5EF;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
        }

            .glow.top {
                width: 560px;
                height: 560px;
                right: -150px;
                top: -220px;
                background: #8016BE;
                opacity: 0.07;
            }

            .glow.left {
                width: 440px;
                height: 440px;
                left: -240px;
                top: 40%;
                background: #A92BE0;
                opacity: 0.045;
            }

        .header {
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            width: 100%;
            padding: 22px 42px;
            background: #0B0B0B;
            border-bottom: 1px solid #29262C;
        }

        .header-inner {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #F7F5EF;
            text-decoration: none;
        }

        .logo {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 600;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 26px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient( 135deg, #A92BE0 0%, #8016BE 100% );
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

            .button:hover {
                opacity: 0.88;
                transform: translateY(-1px);
            }

        .content {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 42px 24px;
        }

        .error-card {
            width: min(900px, 100%);
            padding: 46px 60px;
            border: 1px solid #39323E;
            border-radius: 22px;
            background: rgba(25, 23, 28, 0.96);
            text-align: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        }

        .error-code {
            margin: 0 0 6px;
            font-size: clamp(80px, 12vw, 140px);
            line-height: 0.9;
            font-weight: 800;
            letter-spacing: -6px;
            background: linear-gradient( 135deg, #D99AF4 0%, #A92BE0 45%, #8016BE 100% );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .label {
            display: inline-flex;
            margin-bottom: 16px;
            padding: 7px 14px;
            border: 1px solid #5B2A70;
            border-radius: 20px;
            background: #24122F;
            color: #D99AF4;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .title {
            margin: 0;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.15;
            font-weight: 600;
        }

        .description {
            max-width: 650px;
            margin: 16px auto 0;
            color: #A8A3AD;
            font-size: 16px;
            line-height: 1.65;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 26px;
        }

        .footer {
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            width: 100%;
            padding: 28px 42px;
            background: #0B0B0B;
            border-top: 1px solid #29262C;
            color: #A8A3AD;
            font-size: 12px;
        }

        .footer-inner {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .footer-left {
            justify-self: start;
        }

        .footer-center {
            justify-self: center;
            color: #8016BE;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .footer-right {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .footer-link {
            color: #A8A3AD;
            text-decoration: none;
            transition: color 0.15s ease;
        }

            .footer-link:hover {
                color: #FFFFFF;
            }

        @media (max-width: 700px) {

            body {
                overflow-x: hidden;
            }

            .page {
                min-height: 100svh;
            }

            .glow.top {
                width: 360px;
                height: 360px;
                right: -160px;
                top: -130px;
            }

            .glow.left {
                width: 300px;
                height: 300px;
                left: -180px;
                top: 55%;
            }

            .header {
                padding: 14px 16px;
            }

            .logo {
                width: 32px;
                height: 32px;
            }

            .brand {
                gap: 9px;
            }

            .brand-name {
                font-size: 18px;
            }

            .header .button {
                min-height: 40px;
                padding: 0 15px;
                font-size: 12px;
            }

            .content {
                padding: 24px 16px;
            }

            .error-card {
                padding: 36px 22px;
                border-radius: 18px;
            }

            .error-code {
                margin-bottom: 12px;
                font-size: 92px;
                letter-spacing: -4px;
            }

            .label {
                margin-bottom: 13px;
                font-size: 11px;
            }

            .title {
                font-size: 28px;
            }

            .description {
                margin-top: 13px;
                font-size: 14px;
                line-height: 1.6;
            }

            .actions {
                margin-top: 22px;
            }

                .actions .button {
                    width: 100%;
                }

            .footer {
                padding: 22px 16px;
            }

            .footer-inner {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }

            .footer-left,
            .footer-center,
            .footer-right {
                justify-self: auto;
            }

            .footer-left {
                order: 1;
                text-align: center;
            }

            .footer-center {
                order: 2;
            }

            .footer-right {
                order: 3;
                justify-content: center;
                flex-wrap: wrap;
                gap: 16px;
            }
        }

        @media (max-width: 380px) {

            .error-card {
                padding: 30px 18px;
            }

            .error-code {
                font-size: 78px;
            }

            .title {
                font-size: 25px;
            }

            .description {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="glow top"></div>
        <div class="glow left"></div>
        <header class="header">
            <div class="header-inner">
                <a href="./" class="brand">
                    <img class="logo"
                         src="./images/oxen-logo.png"
                         alt="REMAKE SURVIVAL" />
                    <span class="brand-name">
                        REMAKE SURVIVAL
                    </span>
                </a>
                <a href="./" class="button confirm">
                    НА ГЛАВНУЮ
                </a>
            </div>
        </header>
        <main class="content">
            <section class="error-card">
                <div class="error-code">
                    404
                </div>
                <div class="label">
                    СТРАНИЦА НЕ НАЙДЕНА
                </div>
                <h1 class="title">
                    Кажется, вы забрели не туда.
                </h1>
                <p class="description">
                    Такой страницы не существует или она была перемещена.
                    Возможно, вы просто слишком далеко ушли от базы.
                </p>
                <div class="actions">
                    <a href="./" class="button confirm">
                        ←&nbsp;&nbsp; ВЕРНУТЬСЯ НА ГЛАВНУЮ
                    </a>
                </div>
            </section>
        </main>
        <footer class="footer">
            <div class="footer-inner">
                <div class="footer-left">
                    © 2026 RemakeTeam. Все права защищены.
                </div>
                <div class="footer-center">
                    REMAKE SURVIVAL
                </div>
                <div class="footer-right">
                    <a class="footer-link"
                       data-url="https://t.me/OxideRemake">
                        Telegram
                    </a>
                    <a class="footer-link"
                       data-url="https://shavuhacode.site/terms-of-use">
                        Условия
                    </a>
                    <a class="footer-link"
                       data-url="https://shavuhacode.site/privacy-policy">
                        Политика
                    </a>
                </div>
            </div>
        </footer>
    </div>
    <script type="module">
        import { load, play } from "./js/audio.js";
        import { openUrl } from "./js/app.js";
        load("tap", "./sounds/tap.wav");
        load("confirm", "./sounds/confirm.wav");
        document.querySelectorAll(".button").forEach(button =>
        {
            button.addEventListener("pointerdown", () =>
            {
                play(button.classList.contains("confirm") ? "confirm" : "tap");
            });
        });
        document.querySelectorAll(".footer-link").forEach(link =>
        {
            link.addEventListener("pointerdown", () =>
            {
                play("tap");
            });
            link.addEventListener("click", () =>
            {
                openUrl(link.dataset.url);
            });
        });
    </script>
</body>
</html>
